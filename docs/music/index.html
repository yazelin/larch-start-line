<style>
:root{--veil:247 241 230;--glass:color-mix(in srgb,var(--card) 80%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--veil:27 31 45}}
:root[data-theme="dark"]{--veil:27 31 45}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh}
body::before{z-index:3}

#stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--paper)}
#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.8s ease;transform:scale(1.04)}
#stage img.on{opacity:1;animation:kb var(--kb,20s) linear forwards}
@keyframes kb{from{transform:scale(1.05) translate(var(--x0),var(--y0))}to{transform:scale(1.16) translate(var(--x1),var(--y1))}}
/* 薄紗：上方淡、下方濃，讓壓在亮圖上的字看得清 */
#stage::after{content:"";position:absolute;inset:0;transition:opacity .7s;
  background:linear-gradient(180deg,rgb(var(--veil)/.7) 0,rgb(var(--veil)/0) 16%,rgb(var(--veil)/0) 40%,rgb(var(--veil)/.72) 70%,rgb(var(--veil)/.96) 100%)}
@media (min-width:901px){#stage::after{background:linear-gradient(180deg,rgb(var(--veil)/.7) 0,rgb(var(--veil)/0) 16%,rgb(var(--veil)/0) 46%,rgb(var(--veil)/.75) 76%,rgb(var(--veil)/.95) 100%),linear-gradient(270deg,rgb(var(--veil)/.55),rgb(var(--veil)/0) 40%),linear-gradient(90deg,rgb(var(--veil)/.6),rgb(var(--veil)/0) 50%)}}

#ecg{position:fixed;left:0;right:0;bottom:0;width:100%;height:120px;z-index:1;pointer-events:none}

.top{position:relative;z-index:4;flex:none}
.top .in{height:58px}
.top .ttl2{font-family:var(--f-display);color:var(--ink-2);font-size:15px;letter-spacing:.2em;white-space:nowrap}
.top .footer-icons{margin-left:auto;gap:8px}
.top .footer-icon{width:36px;height:36px;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
@media (max-width:520px){.top .ttl2{display:none}.brand{font-size:17px}}

main{position:relative;z-index:2;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;padding:12px max(24px,calc(50% - 620px)) 0}
#now{align-self:end;max-width:640px;padding-bottom:30px}
.cv{position:relative;width:min(220px,30vw);aspect-ratio:1;margin:0 0 22px;padding:8px;background:var(--card);border-radius:4px;rotate:-1.5deg;
  box-shadow:0 1px 0 var(--line),0 18px 40px -16px rgb(var(--shadow)/.55)}
.cv::before{content:"";position:absolute;z-index:1;top:-10px;left:50%;width:84px;height:22px;translate:-50% 0;rotate:3deg;background:color-mix(in srgb,var(--sky) 50%,transparent);opacity:.8}
.cv img{width:100%;height:100%;object-fit:cover;border-radius:2px;transition:opacity .5s}
#no{font-size:13px;letter-spacing:.22em;color:var(--track);margin:0}
#title{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.6vw,40px);line-height:1.25;margin:4px 0 2px;letter-spacing:.01em}
#scene{margin:0;color:var(--ink-2);font-size:15px}
#line{font-family:var(--f-serif);font-size:clamp(16px,1.6vw,18px);margin:14px 0 20px;padding-left:14px;border-left:3px solid var(--track);color:var(--ink)}
.bar{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
#seek{flex:1;-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer}
#seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--track) var(--p,0%),color-mix(in srgb,var(--ink) 18%,transparent) var(--p,0%))}
#seek::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--track) var(--p,0%),color-mix(in srgb,var(--ink) 18%,transparent) var(--p,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:var(--track);box-shadow:0 0 0 3px #fff}
#seek::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--track);box-shadow:0 0 0 3px #fff}
.ctl{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.ctl button{border:0;cursor:pointer;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--glass);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .2s}
.ctl button:hover{transform:translateY(-1px)}
.ctl svg{width:22px;height:22px;fill:currentColor}
#play{width:60px;height:60px;background:var(--track);color:#fff;box-shadow:0 10px 24px -10px rgb(196 85 62/.8)}
#play svg{width:26px;height:26px}
.ctl .txt{width:auto;border-radius:23px;padding:0 15px 0 12px;font-size:14px;height:40px;display:inline-flex;gap:6px;align-items:center}
.ctl .txt svg{width:17px;height:17px}
#dlbtn{padding:0 12px}
.ctl .txt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ctl .gap{flex:0 0 6px}

#side{min-height:0;display:flex;flex-direction:column;align-self:end;max-height:calc(100% - 24px);margin-bottom:30px;background:var(--glass);border-radius:18px;
  box-shadow:inset 0 0 0 1px var(--line),0 24px 50px -30px rgb(var(--shadow)/.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden}
#sidehead{flex:none;display:flex;align-items:baseline;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
#sidehead b{font-family:var(--f-display);font-weight:400;font-size:20px}
#sidehead span{color:var(--ink-3);font-size:13px}
#grab{display:none}
#list{flex:1;min-height:0;overflow-y:auto;margin:0;padding:6px 0;list-style:none}
#list li{display:grid;grid-template-columns:22px 48px minmax(0,1fr) auto 32px;gap:12px;align-items:center;padding:8px 14px 8px 16px;cursor:pointer;transition:background .2s}
#list li:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
#list li.on{background:color-mix(in srgb,var(--track) 14%,transparent)}
#list .k,#list .eq{grid-area:1/1}
#list .k{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
#list li.on .k{color:var(--track)}
#list img{width:48px;height:48px;border-radius:7px;object-fit:cover}
#list b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .t span{display:block;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .d{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
#list .dl{border:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:none;color:var(--ink-2);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
#list .dl:hover{color:var(--ink)}
#list .dl svg{width:15px;height:15px;fill:currentColor}
/* 正在播的那首，序號換成三條會動的小柱 */
.eq{display:none;justify-self:end;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--track);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.35s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
body.playing #list li.on .k{display:none}
body.playing #list li.on .eq{display:flex}

body.nolist main{grid-template-columns:minmax(0,1fr)}
body.nolist #side{display:none}
body.bare .top,body.bare main,body.bare #ecg{opacity:0;pointer-events:none}
.top,main,#ecg{transition:opacity .6s}
body.bare #stage::after{opacity:.15}
#baretip{position:fixed;z-index:5;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 16px;border-radius:99px;background:rgb(var(--veil)/.8);color:var(--ink-2);font-size:13px;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
body.bare #baretip.show{opacity:1}
#hint{position:fixed;z-index:6;left:50%;top:42%;transform:translate(-50%,-50%);border:0;padding:14px 28px;border-radius:99px;background:var(--track);color:#fff;font-size:16px;letter-spacing:.12em;cursor:pointer;box-shadow:0 14px 30px -12px rgb(196 85 62/.8)}
#hint[hidden]{display:none}

@media (max-width:900px){
  main{grid-template-columns:1fr;padding:0 16px}
  #now{display:grid;grid-template-columns:96px minmax(0,1fr);column-gap:16px;align-items:center;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .cv{width:96px;margin:0;padding:5px;grid-row:span 3;rotate:-2deg}
  .cv::before{width:46px;height:14px;top:-7px}
  #title{font-size:22px}
  #scene{font-size:13.5px}
  #line,.bar,.ctl{grid-column:1/-1}
  #line{font-size:15.5px;margin:16px 0 12px}
  .ctl{justify-content:space-between;gap:6px}
  .ctl .gap{display:none}
  .ctl .txt{padding:0;width:42px;height:42px;justify-content:center;border-radius:50%}
  .ctl .txt span{display:none}
  .ctl{flex-wrap:nowrap}
  #stage::after{background:linear-gradient(180deg,rgb(var(--veil)/.7) 0,rgb(var(--veil)/0) 14%,rgb(var(--veil)/0) 30%,rgb(var(--veil)/.82) 56%,rgb(var(--veil)/.96) 76%)}
  #side{position:fixed;left:0;right:0;bottom:0;max-height:none;height:66dvh;z-index:8;margin:0;border-radius:20px 20px 0 0;background:color-mix(in srgb,var(--card) 95%,transparent)}
  #grab{display:block;flex:none;border:0;background:none;width:100%;padding:10px 0 2px;cursor:pointer;color:var(--ink-3);font-size:12px}
  #grab::before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:var(--ink-3);opacity:.5;margin:0 auto 4px}
  #sidehead{padding:6px 18px 10px}
  #ecg{height:80px}
}
@media (max-width:380px){.ctl button,.ctl .txt{width:38px;height:38px}#play{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){#stage img.on{animation:none}.eq i{animation:none;height:10px}}
</style>
</head>

function inject(){if(!INJECT||findAnchor()||document.querySelector(".yz-cluster"))return;
var n=document.createElement("nav");n.className="yz-cluster";n.setAttribute("aria-label","作者連結");
n.innerHTML='<a href="'+GH+'" target="_blank" rel="noopener" aria-label="GitHub 原始碼" title="GitHub 原始碼">'+ICONS.gh+'</a>'+
'<a href="https://www.facebook.com/yaze.lin.gm" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook">'+ICONS.fb+'</a>'+
'<a href="https://buymeacoffee.com/yazelin" target="_blank" rel="noopener" aria-label="請亞澤喝杯咖啡 Buy me a coffee" title="請亞澤喝杯咖啡 Buy me a coffee">'+ICONS.bmc+'</a>'+
(ADDBLOG?'<a class="yz-blog" href="https://yazelin.github.io/" target="_blank" rel="noopener" aria-label="亞澤的部落格" title="亞澤的部落格">'+ICONS.blog+'</a>':'');
document.body.appendChild(n)}
function blogLinked(){var as=document.querySelectorAll('a[href^="https://yazelin.github.io"]');for(var i=0;i<as.length;i++){try{if(new URL(as[i].href).pathname==="/")return true}catch(e){}}return false}
function addBlog(){if(!ADDBLOG||document.querySelector(".yz-blog")||blogLinked()||!inFooter(anchor))return;
var c=anchor.cloneNode(true);c.classList.remove("yz-hop","yz-idle");c.classList.add("yz-blog");
c.href="https://yazelin.github.io/";c.setAttribute("aria-label","亞澤的部落格");c.setAttribute("title","亞澤的部落格");
if(c.querySelector("svg")){var hasText=!!c.textContent.trim();c.innerHTML=ICONS.blog+(hasText?"部落格":"")}else{c.textContent="部落格"}
anchor.parentNode.insertBefore(c,anchor.nextSibling)}
function hop(){anchor.classList.remove("yz-hop");void anchor.offsetWidth;anchor.classList.add("yz-hop")}
var shown=0,MAX_SHOWS=3;
function say(){if(document.hidden)return;var r=anchor.getBoundingClientRect();if(!r.width&&!r.height)return;if(r.bottom<0||r.top>innerHeight)return;shown++;
bubble.textContent=LINES[Math.floor(Math.random()*LINES.length)];
bubble.classList.remove("yz-on","yz-above","yz-below");
bubble.style.left="0px";bubble.style.top="0px";
var bw=bubble.offsetWidth,bh=bubble.offsetHeight,cx=r.left+r.width/2;
var left=Math.max(8,Math.min(cx-bw/2,innerWidth-bw-8));
var above=r.top-bh-12>=8;
bubble.style.left=left+"px";
bubble.style.top=(above?r.top-bh-12:r.bottom+12)+"px";
bubble.classList.add(above?"yz-above":"yz-below");
bubble.style.setProperty("--yz-tail",Math.max(12,Math.min(cx-left,bw-12))+"px");
hop();
requestAnimationFrame(function(){bubble.classList.add("yz-on")});
setTimeout(function(){bubble.classList.remove("yz-on")},4200)}
function start(){addCss();inject();anchor=findAnchor();if(!anchor)return false;
try{if(getComputedStyle(anchor).display==="inline")anchor.style.display="inline-block"}catch(e){}
anchor.classList.add("yz-idle");
anchor.addEventListener("animationend",function(e){if(e.animationName==="yzHop")anchor.classList.remove("yz-hop")});
try{addBlog()}catch(e){}
bubble=document.createElement("div");bubble.className="yz-bubble";bubble.setAttribute("aria-hidden","true");document.body.appendChild(bubble);
window.__yzPromo=say;
(function loop(first){if(shown>=MAX_SHOWS)return;setTimeout(function(){say();loop(false)},first?18e3+Math.random()*12e3:9e4+Math.random()*9e4)})(true);
return true}
function boot(){var tries=0;(function t(){if(start())return;if(++tries<20)setTimeout(t,1500)})()}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
