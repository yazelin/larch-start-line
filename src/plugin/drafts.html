<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* 仿 LINE 一對一聊天室（樣式取自 line-chat-maker 的 real／memo 皮）。單檔、無外部資源。 */
:root{--wall:#ece4d3;--bar:#f7f3ea;--barfg:#3b3127;--meta:#a08d74;--me:#8de055;--you:#fff;--accent:#06c755}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 30%,#efe8dc,#d9d0c1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#1c1917;-webkit-font-smoothing:antialiased}
#tap{display:none}

/* 桌機：置中的真手機外框 */
#phone{position:absolute;left:50%;top:50%;translate:-50% -50%;height:min(94vh,800px);aspect-ratio:9/18;max-width:94vw;background:#1a1a1e;border-radius:46px;padding:10px;box-sizing:border-box;box-shadow:0 30px 70px rgb(40 30 20/.35),0 8px 24px rgb(0 0 0/.25),0 0 0 1px rgb(255 255 255/.08) inset}
.sbtn{position:absolute;width:3px;background:#2a2a30;border-radius:2px}
.vol1{left:-3px;top:18%;height:38px}.vol2{left:-3px;top:calc(18% + 48px);height:38px}.pwr{right:-3px;top:25%;height:60px}
.island{position:absolute;left:50%;top:20px;translate:-50% 0;width:92px;height:26px;border-radius:14px;background:#050506;z-index:5}
#screen{position:relative;height:100%;border-radius:37px;overflow:hidden;display:flex;flex-direction:column;background:var(--wall)}

/* 手機直向：整個畫面就是手機 */
@media (max-width:560px) and (orientation:portrait){
  #phone{inset:0;translate:none;left:0;top:0;width:100%;height:100%;max-width:none;aspect-ratio:auto;padding:0;border-radius:0;box-shadow:none;background:var(--bar)}
  .sbtn,.island{display:none}
  #screen{border-radius:0}
}

/* 狀態列 */
.statusbar{display:flex;align-items:center;justify-content:space-between;background:var(--bar);color:var(--barfg);font-size:13px;font-weight:600;padding:14px 26px 4px 30px;letter-spacing:.02em}
.sicons{display:inline-flex;align-items:center;gap:5px}
.batt-text{font-size:12px;font-weight:600}
/* 直向全螢幕：播放器頂端有自己的按鈕（約 0–75px），狀態列往下讓，標題列才點得到 */
@media (max-width:560px) and (orientation:portrait){.statusbar{padding:max(52px,env(safe-area-inset-top)) 22px 10px 26px;font-size:15px}}

/* 聊天室標題列 */
#head{display:flex;align-items:center;gap:10px;background:var(--bar);color:var(--barfg);padding:6px 16px 10px 10px;border-bottom:1px solid rgb(0 0 0/.06);cursor:default;user-select:none}
#head .back{width:22px;height:22px;flex:none}
#head .htitle{flex:1;min-width:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#head .hicons{display:inline-flex;align-items:center;gap:17px;opacity:.9}

/* 對話區：數值照 line-chat-maker（real 皮）量出來的，1rem=16px
   換人 9.6px、同一人連續 5.6px（9.6 − 4）、頭像 36px 下移 2px、頭像到泡泡 8px、
   泡泡內距 6.4/12.8、字 14.4/21.6、說話者那側上角 4px 其餘 16px（LINE 現行版無尾巴）、
   時間 11.2px 貼泡泡底、離泡泡 5.6px、已讀在時間上一行、日期膠囊上下 11.2px */
#chat{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 16px 8px;background-color:var(--wall);background-image:radial-gradient(rgb(120 100 70/.07) 1px,transparent 1.2px);background-size:14px 14px}
.date{text-align:center;margin:11.2px 0}
.date span{display:inline-block;font-size:11.52px;line-height:1.6;color:#fbf6ec;background:rgb(107 90 68/.5);border-radius:999px;padding:1.92px 12.8px}
.row{display:flex;align-items:flex-start;gap:8px;margin-bottom:9.6px}
.row.cont{margin-top:-4px;padding-left:44px}
.row .av{width:36px;height:36px;margin-top:2px;border-radius:50%;flex:none;position:relative;overflow:hidden;background:#cfd8e3;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.row .av img{position:absolute;width:406%;left:-152%;top:-58%;max-width:none}
.row .col{min-width:0;flex:1}
.me{display:block}
.brow{display:flex;align-items:flex-end}
.me .brow{justify-content:flex-end}
.meta{display:flex;flex-direction:column;flex:none;font-size:11.2px;line-height:1.6;color:var(--meta);white-space:nowrap}
.you .meta{margin-left:5.6px;align-items:flex-start}
.me .meta{margin-right:5.6px;align-items:flex-end}
.read{opacity:0;transition:opacity .3s}
.read.on{opacity:1}
.msgtxt,.bubble{display:inline-block;min-width:0;max-width:calc(100% - 50px);padding:6.4px 12.8px;font-size:14.4px;line-height:1.5;color:#1c1917;white-space:pre-wrap;word-break:break-word}
.msgtxt{background:var(--you);border-radius:4px 16px 16px 16px}
.bubble{background:var(--me);border-radius:16px 4px 16px 16px;animation:pop .4s cubic-bezier(.2,1.4,.35,1);transform-origin:100% 0}
@keyframes pop{from{scale:.6;opacity:0}}

/* 輸入列 */
#bar{display:flex;align-items:flex-end;gap:14px;background:#fff;color:#6d6d6d;padding:8px 12px 8px 14px;border-top:1px solid rgb(0 0 0/.05)}
#bar .ic{flex:none;margin-bottom:8px;transition:opacity .2s,width .2s}
#bar .plus{width:22px;height:22px}
#bar .chev{display:none;width:20px;height:20px}
#bar.typing .cam,#bar.typing .gal{display:none}
#bar.typing .chev{display:block}
#inbox{flex:1;min-width:0;position:relative;display:flex;align-items:center;background:#f1f0ee;border-radius:19px;min-height:38px;padding:6px 36px 6px 14px;box-sizing:border-box}
#draft{font-size:15px;line-height:1.5;color:#222;white-space:pre-wrap;word-break:break-word;min-height:1.5em}
#draft:empty::before{content:'Aa';color:#a3a3a3}
#draft::after{content:'';display:inline-block;width:2px;height:1.15em;margin-left:1px;vertical-align:-.2em;background:var(--accent);animation:blink 1s steps(1) infinite}
#draft:empty{display:flex;flex-direction:row-reverse;justify-content:flex-end}
#draft:empty::after{margin:0 1px 0 0}
@keyframes blink{50%{opacity:0}}
#inbox .smile{position:absolute;right:9px;bottom:9px;width:20px;height:20px;color:#8d8d8d}
#send{flex:none;width:38px;height:38px;border:0;padding:0;border-radius:50%;background:transparent;color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
#send svg{width:26px;height:26px}
#send[disabled]{color:#b9b9b9;cursor:default}
#send:not([disabled]){animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgb(6 199 85/.35)}50%{box-shadow:0 0 0 7px rgb(6 199 85/0)}}
#send:not([disabled]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.homebar{background:#fff;padding:2px 0 8px;text-align:center;line-height:0}
.homebar span{display:inline-block;width:120px;height:5px;border-radius:999px;background:rgb(0 0 0/.8)}
@media (max-width:560px) and (orientation:portrait){.homebar{padding-bottom:calc(6px + env(safe-area-inset-bottom))}}
</style></head>
<body data-round="0">
<div id="tap"></div>
<div id="phone">
  <div class="sbtn vol1"></div><div class="sbtn vol2"></div><div class="sbtn pwr"></div>
  <div class="island"></div>
  <div id="screen">
    <div class="statusbar">
      <span id="clock">21:47</span>
      <span class="sicons">
        <svg viewBox="0 0 18 12" width="17" height="11" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8" opacity=".35"/></svg>
        <svg viewBox="0 0 24 18" width="16" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 6.5a14.5 14.5 0 0 1 20 0"/><path d="M5.6 10.2a9.4 9.4 0 0 1 12.8 0"/><circle cx="12" cy="14.6" r="1.9" fill="currentColor" stroke="none"/></svg>
        <span class="batt-text">68%</span>
        <svg viewBox="0 0 27 13" width="25" height="12" aria-hidden="true"><rect x=".6" y=".6" width="22.8" height="11.8" rx="3.4" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".45"/><rect x="2.4" y="2.4" width="13.6" height="8.2" rx="1.8" fill="currentColor"/><path d="M25 4.4v4.2a2.2 2.2 0 0 0 0-4.2z" fill="currentColor" opacity=".45"/></svg>
      </span>
    </div>
    <div id="head">
      <svg class="back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>
      <span class="htitle" id="to"></span>
      <span class="hicons">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M15.8 15.8 21 21" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5.2 3.8h3l1.7 4-2.1 1.7a13.4 13.4 0 0 0 6.1 6.1l1.7-2.1 4 1.7v3a1.6 1.6 0 0 1-1.7 1.6C10.3 19.3 4.7 13.7 4.2 5.4a1.6 1.6 0 0 1 1-1.6z"/></svg>
        <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true"><path d="M3 6.4h18v1.9H3zm0 5.2h18v1.9H3zm0 5.2h18v1.9H3z"/></svg>
      </span>
    </div>
    <div id="chat">
      <div class="date"><span id="date"></span></div>
      <div id="history"></div>
      <div id="sent"></div>
    </div>
    <div id="bar">
      <svg class="ic plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
      <svg class="ic cam" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="2.6" y="6.2" width="18.8" height="13.6" rx="3"/><circle cx="12" cy="13" r="3.9"/><path d="M8.2 6.2 9.7 3.6h4.6l1.5 2.6"/></svg>
      <svg class="ic gal" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="3"/><circle cx="9" cy="9" r="1.7" fill="currentColor" stroke="none"/><path d="M4.4 17.2l4.8-4.8 3.8 3.8 2.9-2.9 3.7 3.7"/></svg>
      <svg class="ic chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      <div id="inbox">
        <div id="draft"></div>
        <svg class="smile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><circle cx="9" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.1" fill="currentColor" stroke="none"/><path d="M8.4 14.2c.9 1.4 2.1 2.1 3.6 2.1s2.7-.7 3.6-2.1"/></svg>
      </div>
      <button id="send" disabled><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15.6 12 3.39 13.87z"/></svg></button>
    </div>
    <div class="homebar"><span></span></div>
  </div>
</div>
<script src="common.js"></script>
<script>
var S = {}, n = 0, draft = document.getElementById('draft'), send = document.getElementById('send'), bar = document.getElementById('bar');
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function setDraft(t) { draft.textContent = t; bar.classList.toggle('typing', !!t); }
function type(t, done) { var i = 0; setDraft(''); (function step() { setDraft(t.slice(0, ++i)); if (i < t.length) setTimeout(step, 70); else done(); })(); }
function erase(done) { (function step() { setDraft(draft.textContent.slice(0, -1)); if (draft.textContent) setTimeout(step, 45); else done(); })(); }
function next() { send.disabled = true; type(S.drafts[n], function () { send.disabled = false; }); }
function avatar(src) {
  var av = el('div', 'av', (S.to || '').slice(0, 1));
  if (src) { var img = new Image(); img.alt = ''; img.onload = function () { av.textContent = ''; av.appendChild(img); }; img.src = src; }
  return av;
}
send.onclick = function () {
  send.disabled = true;
  if (n < S.drafts.length - 1) {
    setTimeout(function () { erase(function () { n += 1; document.body.dataset.round = String(n); next(); }); }, 800);
    return;
  }
  var row = el('div', 'row me'), brow = el('div', 'brow'), meta = el('div', 'meta'), read = el('span', 'read', S.readLabel || '已讀');
  meta.appendChild(read); meta.appendChild(el('span', '', S.sentTime || ''));
  var b = el('div', 'bubble', draft.textContent);
  brow.appendChild(meta); brow.appendChild(b); row.appendChild(brow);
  document.getElementById('sent').appendChild(row); setDraft('');
  setTimeout(function () { read.classList.add('on'); }, 800);
  L.set('drafted', true);
  setTimeout(function () { L.done(); }, 1200);
};
L.press(function () { if (!send.disabled) send.click(); });
L.onInit(function (values) {
  S = L.script();
  send.setAttribute('aria-label', S.sendLabel || '送出'); send.title = S.sendLabel || '送出';
  document.getElementById('to').textContent = S.to || '';
  if (S.clock) document.getElementById('clock').textContent = S.clock;
  document.getElementById('date').textContent = S.dateLabel || '';
  var hist = document.getElementById('history');
  (S.history || []).forEach(function (t, i) {
    var row = el('div', 'row you' + (i ? ' cont' : '')), col = el('div', 'col'), brow = el('div', 'brow'), meta = el('div', 'meta');
    if (!i) row.appendChild(avatar(values && values.avatar));
    brow.appendChild(el('div', 'msgtxt', t));
    meta.appendChild(el('span', '', S.historyTime || '')); brow.appendChild(meta);
    col.appendChild(brow); row.appendChild(col); hist.appendChild(row);
  });
  next();
});
</script>
</body></html>
