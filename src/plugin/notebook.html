<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* 少女的筆記本：方格紙、線圈、紙膠帶、便利貼、螢光筆、塗鴉貼紙 */
html,body{margin:0;height:100%;overflow:auto;font-family:"Noto Sans TC","Noto Serif TC",sans-serif;color:#4a3640;
  background:#fbeff2;background-image:radial-gradient(#f3d6de 1.2px,transparent 1.4px);background-size:22px 22px}
#book{position:relative;max-width:1000px;margin:5vh auto;display:grid;grid-template-columns:1fr 1fr;rotate:-.6deg;
  background-color:#fffdf8;background-image:linear-gradient(#f2e7ea 1px,transparent 1px),linear-gradient(90deg,#f2e7ea 1px,transparent 1px);background-size:24px 24px;
  border-radius:6px 14px 14px 6px;box-shadow:0 14px 30px rgba(196,106,138,.18),0 2px 0 #ead9de}
#book::before{content:"";position:absolute;left:50%;top:14px;bottom:14px;width:18px;margin-left:-9px;
  background:radial-gradient(circle at 50% 50%,#fff 3px,#c9a9b5 3.5px,#c9a9b5 5px,transparent 5.5px) 0 0/18px 26px repeat-y}
.tape{position:absolute;width:110px;height:28px;opacity:.85;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tape.a{left:-18px;top:18px;rotate:-38deg;background:repeating-linear-gradient(45deg,#ffd1dc 0 8px,#ffe6ec 8px 16px)}
.tape.b{right:-16px;top:22px;rotate:34deg;background:repeating-linear-gradient(-45deg,#cfe8ff 0 8px,#e7f3ff 8px 16px)}
#book>section{position:relative;padding:34px 40px 30px;min-height:62vh}
h2{display:inline-block;margin:0 0 18px;font-size:22px;letter-spacing:.06em;background:linear-gradient(transparent 58%,#ffc4d3 58% 92%,transparent 92%);padding:0 4px}
ul{list-style:none;padding:0;margin:0}
#clues li{position:relative;margin:0 0 14px;padding:10px 12px 10px 44px;font-size:16px;line-height:1.75;background:rgba(255,255,255,.75);border-radius:10px;border:1px dashed #e7bccb}
#clues li::before{content:counter(c);counter-increment:c;position:absolute;left:10px;top:10px;width:24px;height:24px;border-radius:50%;
  background:#ff9bb8;color:#fff;font:700 14px/24px "Noto Sans TC",sans-serif;text-align:center;box-shadow:0 2px 0 #e7809f}
#clues{counter-reset:c}
#crossed{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px}
#crossed li{font:600 17px "Noto Sans TC",sans-serif;color:#d0577d;text-decoration:line-through wavy #d0577d}
.note{position:relative;background:#fff6b8;padding:18px 20px 16px;rotate:1.2deg;box-shadow:0 8px 16px rgba(160,130,40,.18);margin:6px 0 22px}
.note::before{content:"";position:absolute;left:50%;top:-12px;width:90px;height:22px;margin-left:-45px;background:rgba(255,196,211,.75);rotate:-3deg}
.q{font-size:18px;line-height:1.8;margin:0}
.time{display:flex;align-items:center;justify-content:center;gap:10px;font:700 30px "Noto Sans TC",sans-serif;color:#4a3640}
.time input{width:3em;min-height:56px;font:inherit;text-align:center;border:2px solid #f0a9be;border-radius:14px;background:#fff;color:#4a3640}
.time input:focus-visible{outline:3px solid #ffc4d3;outline-offset:2px}
.step{display:flex;flex-direction:column;gap:8px}
.step button{min-height:44px;min-width:48px;border:0;border-radius:999px;background:#ffe1ea;color:#b84a72;font:700 18px "Noto Sans TC",sans-serif;cursor:pointer;box-shadow:0 2px 0 #f3b8c9;transition:scale .15s}
.step button:active{scale:.94}
#submit{display:block;margin:20px auto 0;min-height:50px;padding:0 28px;font:700 17px "Noto Sans TC",sans-serif;border:0;border-radius:999px;
  background:linear-gradient(180deg,#ff9bb8,#f57ea2);color:#fff;cursor:pointer;box-shadow:0 4px 0 #d9658a,0 8px 18px rgba(245,126,162,.35);transition:scale .15s}
#submit::after{content:" ♡"}
#submit:active{scale:.96}
#msg{display:block;margin-top:16px;min-height:1.8em;font-size:17px;line-height:1.8;text-align:center;color:#b84a72}
.doodle{position:absolute;width:76px;height:auto;pointer-events:none;opacity:.95;filter:drop-shadow(0 1px 0 rgba(0,0,0,.06))}
#tap{display:none}
@media (max-width:640px){#book{grid-template-columns:1fr;margin:2vh 10px;rotate:0deg}#book::before{display:none}#book>section{min-height:auto;padding:28px 22px}.doodle{width:56px}}
#intro{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(251,239,242,.94);padding:24px;box-sizing:border-box}
#intro[hidden]{display:none}
#intro .card{position:relative;max-width:560px;background:#fffdf8;border-radius:14px;padding:30px 34px;box-shadow:0 14px 30px rgba(196,106,138,.2);text-align:center;rotate:-.8deg;
  background-image:linear-gradient(#f2e7ea 1px,transparent 1px);background-size:100% 30px}
#intro .card::before{content:"";position:absolute;left:50%;top:-12px;width:110px;height:24px;margin-left:-55px;background:repeating-linear-gradient(45deg,#ffd1dc 0 8px,#ffe6ec 8px 16px);rotate:2deg}
#intro h2{font-size:23px}
#intro p{font-size:17px;line-height:1.95;margin:0 0 22px;text-align:left}
#begin{min-height:52px;padding:0 30px;font:700 17px "Noto Sans TC",sans-serif;border:0;border-radius:999px;background:linear-gradient(180deg,#ff9bb8,#f57ea2);color:#fff;cursor:pointer;box-shadow:0 4px 0 #d9658a;transition:scale .15s}
#begin:active{scale:.96}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hw{display:block;max-width:100%;height:auto}
#title .hw{max-height:46px}
#title:has(.hw){background:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style></head>
<body>
<div id="tap"></div>
<div id="intro" role="dialog"><div class="card"><h2 id="introTitle"></h2><p id="introText"></p><button id="begin"></button></div></div>
<div id="book"><i class="tape a"></i><i class="tape b"></i>
  <section id="left"><h2 id="title"></h2><ul id="clues"></ul><ul id="crossed"></ul></section>
  <section id="right">
    <div class="note"><p class="q" id="question"></p></div>
    <div class="time">
      <div class="step"><button data-k="hh" data-d="1" aria-label="時加一">＋</button><button data-k="hh" data-d="-1" aria-label="時減一">－</button></div>
      <input id="hh" inputmode="numeric" aria-label="時" value="15">:<input id="mm" inputmode="numeric" aria-label="分" value="30">
      <div class="step"><button data-k="mm" data-d="1" aria-label="分加一">＋</button><button data-k="mm" data-d="-1" aria-label="分減一">－</button></div>
    </div>
    <button id="submit"></button>
    <span id="msg"></span>
  </section>
</div>
<script src="common.js"></script>
<script>
var S = {}, tries = 0, solved = false;
var msg = document.getElementById('msg');
function pad(n) { return String(n).padStart(2, '0'); }
document.querySelectorAll('.step button').forEach(function (b) {
  b.onclick = function () {
    var el = document.getElementById(b.dataset.k), max = b.dataset.k === 'hh' ? 24 : 60;
    el.value = pad(((Number(el.value) || 0) + Number(b.dataset.d) + max) % max);
  };
});
document.getElementById('submit').onclick = function () {
  if (solved) return;
  var ans = pad(Number(document.getElementById('hh').value) || 0) + ':' + pad(Number(document.getElementById('mm').value) || 0);
  tries += 1; L.set('calc_tries', tries);
  if (String(S.answer).split('|').indexOf(ans) >= 0) {   /* 15:43（早一分鐘）或 15:44（剛好同時）都算對 */
    solved = true; L.set('calc_ok', true); msg.textContent = S.right;
    document.getElementById('submit').textContent = S.next;
    document.getElementById('submit').onclick = function () { L.done(); };
    return;
  }
  var li = document.createElement('li'); li.textContent = ans; document.getElementById('crossed').appendChild(li);
  msg.textContent = tries === 1 ? S.hint1 : S.hint2;
};
L.press(function () { if (solved) L.done(); });
L.onInit(function (values) {
  S = L.script(); tries = Number(L.get('calc_tries', 0)) || 0;
  /* 手寫字圖：有圖就顯示圖，文字留給螢幕閱讀器；沒有圖就顯示文字 */
  function hw(el, text, url) { el.textContent = ''; if (url) { var sr = document.createElement('span'); sr.className = 'sr'; sr.textContent = text; var im = document.createElement('img'); im.className = 'hw'; im.alt = ''; im.src = url; el.appendChild(sr); el.appendChild(im); } else el.textContent = text; }
  var hwClues = (values.hwClues || '').split(',');
  hw(document.getElementById('title'), S.title, values.hwTitle);
  document.getElementById('introTitle').textContent = S.title;
  document.getElementById('introText').textContent = S.intro || '';
  document.getElementById('begin').textContent = S.begin || '開始';
  document.getElementById('begin').onclick = function () { document.getElementById('intro').hidden = true; document.getElementById('hh').focus(); };
  hw(document.getElementById('question'), S.question, values.hwQuestion);
  document.getElementById('submit').textContent = S.submit;
  var spots = [['left', 'right:18px;bottom:14px'], ['right', 'right:22px;top:18px'], ['left', 'right:28px;top:26px'], ['right', 'left:26px;bottom:10px']];   /* 愛心放標題旁，不壓到劃掉的答案 */
  (values.doodles || '').split(',').filter(Boolean).forEach(function (u, i) {
    if (!spots[i]) return; var im = document.createElement('img'); im.className = 'doodle'; im.alt = ''; im.src = u;
    im.style.cssText = spots[i][1] + ';rotate:' + ((i % 2 ? 1 : -1) * (6 + i * 3)) + 'deg'; document.getElementById(spots[i][0]).appendChild(im);
  });
  var ul = document.getElementById('clues');
  S.clues.forEach(function (c, i) {
    if (L.get(c.var, false) !== true && L.get(c.var, false) !== 'true') return;
    var li = document.createElement('li'); hw(li, c.text, hwClues[i]); ul.appendChild(li);
  });
});
</script>
</body></html>
